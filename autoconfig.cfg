// Firefox skips the first line of an AutoConfig file; this line must remain a comment.
try {
  // loadSubScript rejects file: URIs, so the autoconfig folder is mapped to
  // resource://process-control/.
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("autoconfig");
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("process-control", Services.io.newFileURI(dir));
  for (const name of ["restart.cfg", "kill-process.cfg"]) {
    try {
      Services.scriptloader.loadSubScript(`resource://process-control/${name}`);
    } catch (e) {
      Cu.reportError(e);
    }
  }
} catch (e) {
  Cu.reportError(e);
}
