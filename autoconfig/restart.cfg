try {
  const PURGE_CACHE_PREF = "browser.restart_menu.purgecache";
  const CONFIRM_PREF = "browser.restart_menu.requireconfirm";
  const SHOW_PREF = "browser.restart_menu.showpanelmenubtn";
  defaultPref(PURGE_CACHE_PREF, false);
  defaultPref(CONFIRM_PREF, true);
  defaultPref(SHOW_PREF, true);

  const PANEL_BUTTON_ID = "appMenu-restart-button2";

  const restartBrowser = win => {
    if (Services.prefs.getBoolPref(CONFIRM_PREF)) {
      if (!Services.prompt.confirm(win, "Restart", "Restart now?")) {
        return;
      }
    }
    const cancelQuit = Cc["@mozilla.org/supports-PRBool;1"].createInstance(
      Ci.nsISupportsPRBool
    );
    Services.obs.notifyObservers(cancelQuit, "quit-application-requested", "restart");
    if (cancelQuit.data) {
      return;
    }
    if (Services.prefs.getBoolPref(PURGE_CACHE_PREF)) {
      Services.appinfo.invalidateCachesOnRestart();
    }
    Services.startup.quit(Ci.nsIAppStartup.eAttemptQuit | Ci.nsIAppStartup.eRestart);
  };

  const addRestartItem = win => {
    const doc = win.document;
    const menu = doc.getElementById("menu_FilePopup");
    const quitItem = doc.getElementById("menu_FileQuitItem");
    if (!menu || !quitItem || doc.getElementById("menu_FileRestartItem")) {
      return;
    }
    const item = doc.createXULElement("menuitem");
    item.id = "menu_FileRestartItem";
    item.setAttribute("label", "Restart");
    item.setAttribute("accesskey", "R");
    item.addEventListener("command", () => restartBrowser(win));
    menu.addEventListener("popupshowing", event => {
      if (event.target == menu) {
        item.hidden = !Services.prefs.getBoolPref(SHOW_PREF);
      }
    });
    quitItem.before(item);
  };

  // The app menu is built from a template when it first opens, so the command and
  // visibility are handled by listeners on the document.
  const addPanelButton = win => {
    const doc = win.document;
    const quitButton = win.PanelMultiView?.getViewNode(doc, "appMenu-quit-button2");
    if (!quitButton || win.PanelMultiView.getViewNode(doc, PANEL_BUTTON_ID)) {
      return;
    }
    const button = doc.createXULElement("toolbarbutton");
    button.id = PANEL_BUTTON_ID;
    button.className = "subviewbutton";
    button.setAttribute("label", "Restart");
    quitButton.before(button);
    doc.addEventListener("command", event => {
      if (event.target.id == PANEL_BUTTON_ID) {
        restartBrowser(win);
      }
    });
    doc.addEventListener("ViewShowing", event => {
      if (event.target.id == "appMenu-mainView") {
        const panelButton = doc.getElementById(PANEL_BUTTON_ID);
        if (panelButton) {
          panelButton.hidden = !Services.prefs.getBoolPref(SHOW_PREF);
        }
      }
    });
  };

  Services.obs.addObserver(win => {
    try {
      addRestartItem(win);
    } catch (e) {
      Cu.reportError(e);
    }
    try {
      addPanelButton(win);
    } catch (e) {
      Cu.reportError(e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
