try {
  const KILL_PROCESS_PREF = "browser.tabs.killProcessInContextMenu";
  defaultPref(KILL_PROCESS_PREF, true);

  const tabPid = tab => {
    const pid = tab?.linkedBrowser?.browsingContext?.currentWindowGlobal?.osPid;
    return pid > 0 && pid != Services.appinfo.processID ? pid : null;
  };

  const countTabsInProcess = pid => {
    let count = 0;
    for (const win of Services.wm.getEnumerator("navigator:browser")) {
      count += win.gBrowser.tabs.filter(tab => tabPid(tab) == pid).length;
    }
    return count;
  };

  // The item must be listed in TabContextMenu.MENU_SECTIONS; an unlisted item leaves
  // stray separators when the menu is rearranged.
  const declareAfterUnloadTab = (node, selector) => {
    if (Array.isArray(node)) {
      const index = node.indexOf("#context_unloadTab");
      if (index != -1 && !node.includes(selector)) {
        node.splice(index + 1, 0, selector);
      }
      node.forEach(child => declareAfterUnloadTab(child, selector));
    } else if (node && typeof node == "object") {
      Object.values(node).forEach(child => declareAfterUnloadTab(child, selector));
    }
  };

  const addKillProcessItem = win => {
    const doc = win.document;
    const menu = doc.getElementById("tabContextMenu");
    const unloadItem = doc.getElementById("context_unloadTab");
    if (!menu || !unloadItem || doc.getElementById("context_killTabProcess")) {
      return;
    }
    if (win.TabContextMenu?.MENU_SECTIONS) {
      declareAfterUnloadTab(win.TabContextMenu.MENU_SECTIONS, "#context_killTabProcess");
    }
    const item = doc.createXULElement("menuitem");
    item.id = "context_killTabProcess";
    item.setAttribute("label", "Kill Process");
    item.setAttribute("accesskey", "K");
    item.addEventListener("command", () => {
      const pid = tabPid(win.TabContextMenu.contextTab);
      if (pid) {
        Cc["@mozilla.org/processtools-service;1"]
          .getService(Ci.nsIProcessToolsService)
          .kill(pid);
      }
    });
    menu.addEventListener("popupshowing", event => {
      if (event.target != menu) {
        return;
      }
      const pid = tabPid(win.TabContextMenu.contextTab);
      item.hidden = !Services.prefs.getBoolPref(KILL_PROCESS_PREF) || !pid;
      if (!item.hidden) {
        const count = countTabsInProcess(pid);
        item.setAttribute("label", `Kill Process (${count} ${count == 1 ? "tab" : "tabs"})`);
      }
    });
    unloadItem.after(item);
  };

  Services.obs.addObserver(win => {
    try {
      addKillProcessItem(win);
    } catch (e) {
      Cu.reportError(e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
